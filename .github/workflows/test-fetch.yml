name: test fetch

on:
  workflow_dispatch:

jobs:
  test-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install requests feedparser

      - name: Fetch latest papers
        timeout-minutes: 30
        run: |
          source .venv/bin/activate
          python fetch.py

      - name: Show result
        run: |
          python -c "
          import json
          d = json.load(open('papers.json'))
          print('total papers:', len(d))
          print('with published_iso:', sum(1 for p in d if p.get('published_iso')))
          for p in d[:5]:
              print(' -', p.get('published_iso', '<legacy>'), p['title'][:60])
          "
          git diff --stat
